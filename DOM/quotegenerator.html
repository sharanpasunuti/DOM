<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            background-color: aliceblue;
            height: 100vh;
            width: 100wh;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .box{
            background-color: rgb(201, 249, 149);
           
            width: 500px;
            border: 2px solid;
            padding: 20px 30px;
        }
        button{
            background-color: rgb(108, 108, 252);
            padding: 5px 5px;
            color: white;
            font-size:15px;
            border: none;
            border-radius: 5px;
            cursor:pointer;
        }
        button:hover{
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
         <h1>Quote Generator</h1>
         <p class="quote-text">view the quote</p>
         <p class="quote-author">view author</p>
         <button>New Quote</button>
    </div>
    </div>
    <script>
       function generatequote(){
         let randomIndex = Math.floor(Math.random() * quotes.length);
         let randomQuote = quotes[randomIndex];

        let quote= document.querySelector(".quote-text")
        quote.innerText = `"${randomQuote.text}"`;

        let author= document.querySelector(".quote-author")
        author.innerText = `- ${randomQuote.author}`;
      }

        let btn=document.querySelector("button")
        btn.addEventListener("click",generatequote)
        const quotes=[
            	{text:"A rose by any other name would smell as sweet", author:"William Shakespere"},
	            {text:"I have always depended on the kindness of strangers.", author:"Blanche Dubois"},
                {text:"Do until someones's maximum is your minimum", author:"sharanteja"}
        ]
     
    </script>
</body>
</html>
