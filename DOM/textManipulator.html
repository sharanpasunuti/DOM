<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Text Manipulator</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            background-color: rgb(219, 220, 221);
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box-container{
            background-color: rgb(191, 246, 246);
            padding: 20px 30px;
            border: 1px solid;
            border-radius: 10px;
        }
        .btn{
            padding: 5px 20px;
            gap: 20px;
            font-size: 15px;
            font-style:oblique;
            height: 40%;
            width: 40%;


        }
        input{
            width: 100%;
        }
        .backgroundColour{
            background-color: yellow ;
        }
      
    </style>
</head>
<body>
    <div class="container">
        <div class="box-container">
            <h1>Interactive Text Manipulator</h1>
            <input type="text" placeholder="Type something.....">

            <p>Your text will appear here..</p>
            <button class="btn" id="btn1">Show Text</button>
            <button class="btn" id="btn2">Clear</button>
            <button class="btn" id="btn3">UpperCase</button>          
            <button class="btn" id="btn4">Toggle Highlight</button>
            
        </div>     
    </div>

    <script>
        function toggleHighlight(){
               let para= document.querySelector("p")
               para.classList.toggle("backgroundColour")
        }

        function uppercase(){
             let para= document.querySelector("p")
             let data=document.querySelector("input")
             para.innerText=`"${data.value.toUpperCase()}"`;
        }

        function clear(){
             let para= document.querySelector("p")
             let data=document.querySelector("input")
             para.innerText=" ";
        }

        function showtext(){
           let para= document.querySelector("p")
           let data=document.querySelector("input")
           para.innerText=`"${data.value}"`;
        } 

        let button1=document.querySelector("#btn1")
        button1.addEventListener("click",showtext)

        let button2=document.querySelector("#btn2")
        button2.addEventListener("click",clear)

        let button3=document.querySelector("#btn3")
        button3.addEventListener("click",uppercase)

        let button4=document.querySelector("#btn4")
        button4.addEventListener("click", toggleHighlight)

    </script>
</body>
</html>
