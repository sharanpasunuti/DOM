<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          
        }

    </style>
</head>
<body>
    
       <h1>KeyBoard Controlled Counter Game</h1>
      
              <p>Press A to increase, D to decrease, S to reset</p>
              <h2 class="score">0</h2>
              <button id="togglebtn">Disable Controls</button>
        


    <script>
        let count=0;
        let score=document.querySelector(".score")
        let togglebtn=document.querySelector("#togglebtn")
        function updateScore() {
            score.innerHTML=count;
        }
          
        function countController(event) {

             let key=event.key.toLowerCase()
            if(key==="a"){
                count++;
            }
            else if(key ==="d"){
                count--;
            }
            else if(key==="s"){
                count=0;
            }
            else{
                return;
            }

            updateScore()
        }

        
        function togglecontrol(){
            isEnabled = !isEnabled;
            if(isEnabled){
                togglebtn.textContent= "Disable button"
            }
            else{
                togglebtn.textContent="Enable button"
            }
          
        }
        document.addEventListener("keypress",countController)
        document.addEventListener("keypress",togglecontrol)
    </script>
</body>
</html>
